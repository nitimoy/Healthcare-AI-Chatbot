version: '3.8'

services:
  medical-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical_chatbot_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OMP_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - PYTHONPATH=.
    volumes:
      # Persist ChromaDB vector index across container runs
      - ./data/chroma:/app/data/chroma
      # Cache HuggingFace model weights (~1.2 GB BAAI/bge-m3) so re-runs don't re-download
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
